user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # --- Gzip compression ---
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss application/atom+xml
                    image/svg+xml;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=global_limit:20m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=20r/m;

    # --- Upstream: 2 API Gateway instances (least-connections) ---
    upstream api_gateway {
        least_conn;

        server api-gateway-1:4000 max_fails=3 fail_timeout=30s;
        server api-gateway-2:4000 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin" always;

        # ── Nginx self-health (no upstream involved) ──────────────────────
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ── Gateway health check (pass-through, unthrottled) ──────────────
        location = /health {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 10s;
        }

        # ── Auth endpoints — strict rate limit ────────────────────────────
        location ~ ^/api/users/auth/ {
            limit_req        zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ── Razorpay webhook — raw body, no rate limit, no buffering ──────
        location = /api/payments/webhooks/razorpay {
            proxy_pass              http://api_gateway;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection        "";
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout      60s;
        }

        # ── All other API routes ──────────────────────────────────────────
        location /api/ {
            limit_req        zone=global_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ── Catch-all ─────────────────────────────────────────────────────
        location / {
            add_header Content-Type application/json always;
            return 404 '{"success":false,"message":"Not Found"}';
        }
    }
}
